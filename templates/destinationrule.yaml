{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "marketplace-service.fullname" . }}
  labels:
    {{- include "marketplace-service.labels" . | nindent 4 }}
spec:
  host: {{ include "marketplace-service.fullname" . }}
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
{{- end }}
