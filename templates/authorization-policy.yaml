{ { - if .Values.istio.enabled } }
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: { { include "catalog-service.fullname" . } }-allow-internal
  labels:
    {{- include "catalog-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      { { - include "catalog-service.selectorLabels" . | nindent 6 } }
  action: ALLOW
  rules:
    # Allow internal service-to-service calls
    - from:
        - source:
            { { - if .Values.istio.authorization } }
              { { - if .Values.istio.authorization.internalCallers } }
              principals: { { .Values.istio.authorization.internalCallers | toJson } }
              { { - end } }
              { { - end } }
      to:
        - operation:
            ports: [ "9090" ]

    # Allow internal service-to-service calls (REST)
    - from:
        - source:
            { { - if .Values.istio.authorization } }
              { { - if .Values.istio.authorization.internalCallers } }
              principals: { { .Values.istio.authorization.internalCallers | toJson } }
              { { - end } }
              { { - end } }
      to:
        - operation:
            methods: [ "GET", "POST", "PUT", "DELETE" ]
            paths: [ "/api/v1/internal/*", "/api/v1/internal/**" ]

    # Allow user endpoints (catalog, gyms, checkout, admin, stores)
    - to:
        - operation:
            methods: [ "GET", "POST", "PUT", "DELETE" ]
            paths:
              - "/api/v1/catalog"
              - "/api/v1/catalog/*"
              - "/api/v1/catalog/**"
              - "/api/v1/gyms"
              - "/api/v1/gyms/*"
              - "/api/v1/gyms/**"
              - "/api/v1/checkout"
              - "/api/v1/checkout/*"
              - "/api/v1/checkout/**"
              - "/api/v1/admin/categories"
              - "/api/v1/admin/categories/*"
              - "/api/v1/admin/categories/**"
              - "/api/v1/stores"
              - "/api/v1/stores/*"
              - "/api/v1/stores/**"
              - "/catalog.GymService/*"
              - "/grpc.reflection.v1alpha.ServerReflection/*"
              - "/grpc.health.v1.Health/*"

    # Allow public endpoints (health, docs)
    - to:
        - operation:
            methods: [ "GET" ]
            paths:
              - "/v3/api-docs"
              - "/v3/api-docs/*"
              - "/v3/api-docs/**"
              - "/swagger-ui/*"
              - "/swagger-ui.html"
              - "/actuator/health"
              - "/actuator/health/*"
              - "/health"


  { { - end } }
