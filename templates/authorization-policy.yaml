{{- if .Values.istio.enabled }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "marketplace-service.fullname" . }}-auth
  labels:
    {{- include "marketplace-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "marketplace-service.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
  - to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
        paths: ["/api/v1/internal/*", "/api/v1/internal/**"]
    {{- if .Values.istio.authorization }}
    {{- if .Values.istio.authorization.internalCallers }}
    from:
    - source:
        principals: {{ .Values.istio.authorization.internalCallers | toJson }}
    {{- end }}
    {{- end }}
  - to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
        paths:
          - "/api/v1/trainers/*"
          - "/api/v1/trainers/**"
          - "/api/v1/programs/*"
          - "/api/v1/programs/**"
          - "/v3/api-docs/*"
          - "/v3/api-docs"
          - "/swagger-ui/*"
          - "/swagger-ui.html"
          - "/actuator/*"
{{- end }}
