hpa:
  cpuUtilization: '90'
  enabled: false
  maxReplicas: '3'
  memoryUtilization: 450Mi
  minReplicas: '1'
image:
  imagePullSecrets:
    - name: ghcr-secret
  pullPolicy: IfNotPresent
  repository: ghcr.io/fitnest-code/catalog-backend
  tag: production-f39e441
networkPolicy:
  allowedServices:
    - user-backend
    - identity-backend
    - order-backend
  enabled: true
replicaCount: 1
resources:
  requests:
    cpu: 200m
    memory: 896Mi
  limits:
    cpu: 2000m
    memory: 1792Mi
service:
  grpcPort: 9090
  port: 8080
  type: ClusterIP
vaultEnv: development
database:
  hikariMaxPool: 30
  hikariMinIdle: 10
