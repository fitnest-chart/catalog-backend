replicaCount: 1
image:
  repository: ghcr.io/fitnest-backend/marketplace-service
  tag: "development-f54945e"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
istio:
  enabled: true
  host: "marketplace-service"
  mtls:
    mode: STRICT
  authorization:
    internalCallers:
      - "cluster.local/ns/fitnest-dev/sa/user-service"
      - "cluster.local/ns/fitnest-dev/sa/identity-service"
      - "cluster.local/ns/fitnest-dev/sa/order-service"
      - "cluster.local/ns/fitnest-dev/sa/api-gateway"
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql-marketplace:5432/fitnest_marketplace"
  SPRING_DATASOURCE_USERNAME: "fitnest_marketplace"
  SPRING_DATASOURCE_PASSWORD: "marketplace_password_123"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"
  SPRING_REDIS_PASSWORD: ""
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  JWT_SECRET: "your-jwt-secret-change-in-production"
  JWT_ISSUER: "fitnest"
  IDENTITY_SERVICE_URL: "http://identity-service:8080"
  USER_SERVICE_URL: "http://user-service:8080"
  MEDIA_SERVICE_URL: "http://media-service:8086"
  JAVA_OPTS: "-XX:TieredStopAtLevel=1 -Xss256k -Xmx448m"
resources:
  requests:
    cpu: 100m
    memory: 448Mi
  limits:
    cpu: 500m
    memory: 768Mi
