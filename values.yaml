replicaCount: 1
image:
  repository: ghcr.io/fitnest-backend/fitmarket-service
  tag: "development-6bafc86"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
istio:
  enabled: true
  host: "fitmarket-service"
  mtls:
    mode: STRICT
  authorization:
    internalCallers:
      - "cluster.local/ns/fitnest-dev/sa/user-service"
      - "cluster.local/ns/fitnest-dev/sa/iam-service"
env:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql-fitmarket:5432/fitnest_fitmarket"
  SPRING_DATASOURCE_USERNAME: "fitnest_fitmarket"
  SPRING_DATASOURCE_PASSWORD: "fitmarket_password_123"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_REDIS_HOST: "redis.fitnest-dev.svc.cluster.local"
  SPRING_REDIS_PORT: "6379"
  SPRING_REDIS_PASSWORD: ""
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service.fitnest-dev.svc.cluster.local:9092"
  JWT_SECRET: "your-jwt-secret-change-in-production"
  JWT_ISSUER: "fitnest"
  IAM_SERVICE_URL: "http://iam-service:8080"
  USER_SERVICE_URL: "http://user-service:8080"
  MEDIA_SERVICE_URL: "http://media-service:8086"
  MEDIA_SERVICE_URL: "http://media-service:8086"
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
