replicaCount: 1
image:
  repository: ghcr.io/fitnest-backend/catalog-service
  tag: "development-e89a3f9"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090
istio:
  enabled: true
  host: "catalog-service"
  mtls:
    mode: STRICT
  authorization:
    internalCallers:
      - "cluster.local/ns/fitnest-dev/sa/user-service"
      - "cluster.local/ns/fitnest-dev/sa/identity-service"
      - "cluster.local/ns/fitnest-dev/sa/order-service"
      - "cluster.local/ns/fitnest-dev/sa/api-gateway"
hpa:
  enabled: false
  minReplicas: "1"
  maxReplicas: "3"
  cpuUtilization: "90"
  memoryUtilization: "450Mi"
env:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRINGDOC_SERVER_URL: "https://dev-api.fitnest.az"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql-shared:5432/fitnest_catalog"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "shared_password_root_123"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: ""
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  JWT_SECRET: "your-jwt-secret-change-in-production"
  JWT_ISSUER: "fitnest"
  USER_SERVICE_URL: "http://user-service:8080"
  STORAGE_SERVICE_URL: "http://storage-service:8080"
  # Optional: enable gRPC-based storage client instead of HTTP. When true, set STORAGE_GRPC_ADDRESS.
  USE_GRPC_STORAGE: "false"
  STORAGE_GRPC_ADDRESS: "dns:///storage-service.fitnest-dev.svc.cluster.local:9090"
  # gRPC TLS / mTLS options for internal service-to-service calls (used by gRPC clients)
  GRPC_USE_TLS: "false" # set to "true" to enable TLS for outgoing gRPC calls
  GRPC_TLS_CLIENT_CERT: "/etc/certs/tls.crt" # mounted cert path when using mTLS
  GRPC_TLS_CLIENT_KEY: "/etc/certs/tls.key"
  GRPC_TLS_CA_CERT: "/etc/certs/ca.crt"
  GRPC_SERVER_TLS_ENABLED: "false" # set to true if exposing gRPC server with TLS
  JAVA_TOOL_OPTIONS: >
    -Xms256m -Xmx768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=256m -XX:+AlwaysPreTouch -Xss512k -XX:+ExitOnOutOfMemoryError

  LOGGING_LEVEL_ROOT: INFO
  LOGGING_LEVEL_AZ_FITNEST_CATALOG: DEBUG
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
resources:
  requests:
    cpu: 400m
    memory: 768Mi
  limits:
    cpu: 1000m
    memory: 1536Mi
