# values.yaml for catalog-backend

replicaCount: 1
image:
  repository: ghcr.io/fitnest-code/catalog-backend
  tag: "development-48329c1"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090
# NetworkPolicy replaces Istio AuthorizationPolicy
networkPolicy:
  enabled: true
  allowedServices:
    - user-backend
    - identity-backend
    - order-backend
    # gateway-backend is already hardcoded in the policy
hpa:
  enabled: false
  minReplicas: "1"
  maxReplicas: "3"
  cpuUtilization: "90"
  memoryUtilization: "450Mi"
env:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRINGDOC_SERVER_URL: "https://dev-api.fitnest.az"
  SPRING_DATASOURCE_URL: jdbc:postgresql://10.0.0.4:5432/fitnest_catalog?sslmode=disable
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "shared_password_root_123"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_DATA_REDIS_HOST: "10.0.0.4"
  SPRING_DATA_REDIS_PORT: "6380"
  SPRING_DATA_REDIS_PASSWORD: "ChangeMeDevRedis!"
  SPRING_DATA_REDIS_TIMEOUT: "2000ms"
  KAFKA_BOOTSTRAP_SERVERS: "10.0.0.4:9092"
  JWT_SECRET: "your-jwt-secret-change-in-production"
  JWT_ISSUER: "fitnest"
  USER_BACKEND_URL: "http://user-backend:8080"
  STORAGE_BACKEND_URL: "http://storage-backend:8080"
  USE_GRPC_STORAGE: "false"
  STORAGE_GRPC_ADDRESS: "dns:///storage-backend.fitnest-development.svc.cluster.local:9090"
  GRPC_USE_TLS: "false"
  GRPC_TLS_CLIENT_CERT: "/etc/certs/tls.crt"
  GRPC_TLS_CLIENT_KEY: "/etc/certs/tls.key"
  GRPC_TLS_CA_CERT: "/etc/certs/ca.crt"
  GRPC_SERVER_TLS_ENABLED: "false"
  JAVA_TOOL_OPTIONS: >
    -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=256m -XX:+AlwaysPreTouch -Xss512k -XX:+ExitOnOutOfMemoryError

  LOGGING_LEVEL_ROOT: INFO
  LOGGING_LEVEL_AZ_FITNEST_CATALOG: DEBUG
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: WARN
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: WARN
resources:
  requests:
    cpu: 35m
    memory: 845Mi
  limits:
    cpu: 1000m
    memory: 1300Mi
